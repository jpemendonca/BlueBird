<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f7bff">
<title>BlueBird</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f7bff'/%3E%3Cellipse cx='40' cy='58' rx='22' ry='18' fill='%23fff'/%3E%3Ccircle cx='55' cy='41' r='11' fill='%23fff'/%3E%3Cpath d='M64 38l10 4-10 4z' fill='%23ffc43d'/%3E%3Cpath d='M22 56L6 46l4 16z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #eaf1ff; --bg2: #d3e3ff; --card: #ffffff; --card-edge: #d4e1fa; --ink: #0d1b3e; --mute: #4d628f;
  --blue: #2f7bff; --blue-2: #1f5fe0; --sky: #1f66e5; --on-blue: #ffffff; --chip: #eef3ff;
  --green: #3ddc84; --amber: #ffc43d; --red: #d63c3c; --ok: #14a35a;
  --hero-1: #3a86ff; --hero-2: #2453d6;
  --shadow: 0 8px 24px rgba(31, 95, 224, .12);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: linear-gradient(180deg, var(--bg2), var(--bg) 340px) fixed, var(--bg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
main { max-width: 780px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
header svg { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 4px 10px rgba(47, 123, 255, .45)); }
header h1 { font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
header .ver { color: var(--mute); font-size: .85rem; margin-left: auto; }
.lang-sel { font-size: .85rem; font-weight: 600; padding: 6px 8px; }
section { background: var(--card); border: 1px solid var(--card-edge); border-radius: 18px; padding: 18px;
  margin-bottom: 14px; box-shadow: var(--shadow); }
h2 { font-size: .85rem; margin: 0 0 12px; color: var(--sky); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
section.hero { background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); border: 0; color: #fff; position: relative; overflow: hidden; }
section.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%;
  border: 18px solid rgba(255, 255, 255, .08); box-shadow: 0 0 0 26px rgba(255, 255, 255, .05); pointer-events: none; }
section.hero h2 { color: rgba(255, 255, 255, .85); }
.status { display: flex; gap: 14px; align-items: flex-start; position: relative; z-index: 1; }
.dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 9px; flex: none; background: rgba(255, 255, 255, .5); }
.dot.ok { background: var(--green); box-shadow: 0 0 0 6px rgba(61, 220, 132, .25); }
.dot.busy { background: var(--amber); animation: pulse 1s infinite; }
.dot.err { background: #ff8a8a; }
@keyframes pulse { 50% { opacity: .35; } }
.big { font-size: 1.55rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.sub { color: rgba(255, 255, 255, .88); margin-top: 4px; }
.err-text { margin-top: 8px; background: rgba(0, 0, 0, .2); border-radius: 10px; padding: 8px 12px; }
.tip { margin-top: 12px; font-size: .9rem; color: rgba(255, 255, 255, .85); position: relative; z-index: 1; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; position: relative; z-index: 1; }
button { font: inherit; font-weight: 600; border: 1px solid var(--card-edge); background: var(--chip); color: var(--ink);
  border-radius: 12px; padding: 10px 18px; cursor: pointer; transition: transform .08s, filter .15s; }
button:hover { filter: brightness(1.04); }
button:active { transform: scale(.97); }
button.primary { background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: var(--on-blue); border-color: transparent;
  box-shadow: 0 6px 16px rgba(47, 123, 255, .3); }
button.danger { color: var(--red); }
button.light { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .35); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.vol { display: flex; align-items: center; gap: 12px; margin-top: 18px; position: relative; z-index: 1; }
.vol input { flex: 1; min-width: 0; accent-color: #fff; }
.vol span { min-width: 3.5em; text-align: right; color: rgba(255, 255, 255, .9); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--card-edge); }
ul.list li:first-child { border-top: 0; }
ul.list .ico { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; font-size: 1.1rem; }
ul.list .name { flex: 1 1 150px; min-width: 0; }
ul.list .name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.list .name small { color: var(--mute); }
/* The buttons drop to their own line when the name would be squeezed (phone width) */
ul.list .acts { display: flex; gap: 8px; margin-left: auto; }
.empty { color: var(--mute); padding: 4px 0; }
.hint { color: var(--mute); font-size: .92rem; margin: 0; }
label.toggle { display: flex; gap: 10px; align-items: center; margin-top: 12px; cursor: pointer; }
label.toggle input { width: 20px; height: 20px; flex: none; accent-color: var(--blue); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--mute); } dl.kv dd { margin: 0; overflow-wrap: anywhere; }
select { font: inherit; background: var(--chip); color: var(--ink); border: 1px solid var(--card-edge); border-radius: 10px; padding: 8px; }
textarea { font: inherit; width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--card-edge); border-radius: 12px;
  padding: 10px 12px; color: var(--ink); background: var(--chip); }
.report { margin-top: 14px; border-top: 1px solid var(--card-edge); padding-top: 14px; }
.report label { display: block; font-weight: 600; margin: 12px 0 6px; }
.report-msg { margin: 10px 0 0; font-weight: 600; }
.report-msg.ok { color: var(--ok); } .report-msg.bad { color: var(--red); }
.code { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; padding: 12px 14px; border-radius: 14px;
  background: var(--chip); border: 1px dashed var(--blue); }
.code b { font-size: 1.8rem; letter-spacing: .18em; color: var(--sky); font-family: ui-monospace, Consolas, monospace; }
details summary { cursor: pointer; color: var(--sky); font-weight: 700; margin-top: 16px; }
pre { background: var(--bg); border: 1px solid var(--card-edge); border-radius: 12px; padding: 10px; max-height: 320px;
  overflow: auto; font-size: .78rem; white-space: pre-wrap; word-break: break-word; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 10px 16px; border-radius: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; font-weight: 600; max-width: 90vw; }
.toast.on { opacity: 1; }
footer { text-align: center; color: var(--mute); font-size: .85rem; margin: 8px 0 24px; }
footer a { color: var(--sky); }
html.tv body { font-size: 22px; }
html.tv main { max-width: 1120px; }
html.tv button { padding: 14px 26px; }
@media (max-width: 480px) {
  ul.list .acts { width: 100%; } ul.list .acts button { flex: 1; }
  .big { font-size: 1.25rem; } section { padding: 15px; border-radius: 16px; }
  header h1 { font-size: 1.25rem; } header .ver { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#2347b8"/></linearGradient></defs>
      <rect width="100" height="100" rx="22" fill="url(#g)"/>
      <ellipse cx="40" cy="58" rx="22" ry="18" fill="#fff"/><circle cx="55" cy="41" r="11" fill="#fff"/>
      <path d="M64 38l10 4-10 4z" fill="#ffc43d"/><path d="M22 56L6 46l4 16z" fill="#fff"/>
      <circle cx="58" cy="39" r="2" fill="#0d1b3e"/>
      <path d="M78 34a14 14 0 0 1 0 16M84 28a22 22 0 0 1 0 28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>BlueBird</h1>
    <span class="ver" id="ver"></span>
    <select class="lang-sel" id="langSel"></select>
  </header>

  <section class="hero" aria-live="polite">
    <h2 data-t="device"></h2>
    <div class="status">
      <div class="dot" id="dot"></div>
      <div>
        <div class="big" id="headline"></div>
        <div class="sub" id="detail"></div>
        <div class="err-text" id="error" hidden></div>
      </div>
    </div>
    <div class="row">
      <button id="btn-disconnect" class="light" data-t="disconnect" hidden></button>
      <button id="btn-tone" class="light" data-t="tone" hidden></button>
    </div>
    <div class="vol">
      <label for="vol" data-t="volume"></label>
      <input type="range" id="vol" min="0" max="100" step="1">
      <span id="vol-v"></span>
    </div>
    <p class="tip" id="tip" data-t="tip_controller" hidden></p>
  </section>

  <section>
    <h2 data-t="search"></h2>
    <p class="hint" data-t="search_hint"></p>
    <div class="row"><button class="primary" id="btn-scan" data-t="scan"></button></div>
    <ul class="list" id="found"></ul>
    <label class="toggle" id="others-wrap" hidden><input type="checkbox" id="others"><span data-t="show_others"></span></label>
  </section>

  <section>
    <h2 data-t="saved"></h2>
    <ul class="list" id="saved"></ul>
    <label class="toggle"><input type="checkbox" id="auto"><span data-t="auto"></span></label>
  </section>

  <section>
    <h2 data-t="adapter"></h2>
    <dl class="kv" id="adapter"></dl>
    <div class="row" id="prefer-row" hidden>
      <label for="prefer" data-t="prefer"></label>
      <select id="prefer"></select>
    </div>
  </section>

  <section>
    <h2 data-t="help"></h2>
    <p class="hint" data-t="help_hint"></p>
    <div class="row">
      <button class="primary" id="btn-report" data-t="report"></button>
      <button id="btn-copy" data-t="copy"></button>
    </div>
    <div class="report" id="report-box" hidden>
      <p class="hint" data-t="report_note"></p>
      <label for="report-msg" data-t="report_msg"></label>
      <textarea id="report-msg" maxlength="2000"></textarea>
      <div class="row">
        <button class="primary" id="btn-report-send" data-t="report_send"></button>
        <button id="btn-report-close" data-t="report_close"></button>
      </div>
      <p class="report-msg" id="report-status"></p>
      <div class="code" id="report-code" hidden>
        <span data-t="report_sent"></span><b id="report-code-text"></b>
        <button id="btn-report-copy" data-t="report_copy"></button>
      </div>
      <p class="hint" id="report-code-hint" data-t="report_code_hint" hidden></p>
      <p class="hint" data-t="report_privacy" style="margin-top:10px"></p>
    </div>
    <details id="diag">
      <summary data-t="details"></summary>
      <dl class="kv" id="numbers" style="margin-top:12px"></dl>
      <div class="row"><button id="btn-log" data-t="reload_log"></button></div>
      <pre id="log"></pre>
    </details>
  </section>
  <footer>BlueBird · <a href="https://github.com/jpemendonca/BlueBird" target="_blank" rel="noopener">GitHub</a></footer>
</main>
<div class="toast" id="toast"></div>

const params = new URLSearchParams(location.search);
if (params.has("tv")) document.documentElement.classList.add("tv");
/* The viewer's own choice wins; without one the page follows the console's language, then the
 * browser's, then English. The choice is kept in this browser, as OmniPad does. */
const load = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } };
const chosen = I18N[params.get("lang")] ? params.get("lang") : I18N[load("bluebird.lang", "")] ? load("bluebird.lang", "") : "";
let lang = chosen || (I18N[(navigator.language || "").slice(0, 2)] ? navigator.language.slice(0, 2) : "en");
let langFromConsole = !!chosen;
const T = (k, vars) => {
  let s = (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
  for (const v in vars || {}) s = s.replace("{" + v + "}", vars[v]);
  return s;
};
const $ = (id) => document.getElementById(id);
/* Lists are rebuilt only when they change: a rebuild every second would take the focus away
 * from a button the controller is on, in the console's browser */
const setHtml = (el, html) => { if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function applyText() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  $("langSel").value = lang;
  $("langSel").setAttribute("aria-label", T("language"));
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("on"), 2400);
}

async function post(path) {
  try {
    const r = await fetch(path, { method: "POST" });
    const j = await r.json();
    if (!j.ok) toast(T("busy"));
    return j.ok;
  } catch (e) { toast(T("busy")); return false; }
}

let state = null, volumeTouched = 0, keepLogText = false;

function errorText(err, name) {
  if (!err) return "";
  if (/did not answer/.test(err)) return T("err_answer", { n: name });
  if (/pairing .*failed|authentication/i.test(err)) return T("err_pair");
  if (/out of range/.test(err)) return T("err_range");
  return err;
}

function renderStatus(s) {
  const link = s.link, a = s.adapter, name = link.name || T("unnamed");
  let dot = "", head = "", sub = "", err = "";
  const disconnect = $("btn-disconnect"), tone = $("btn-tone");
  disconnect.hidden = tone.hidden = true;
  if (!a.present) {
    head = s.bt === "adapter lost" ? T("lost") : T("no_adapter");
    sub = s.bt === "adapter lost" ? T("lost_sub") : T("no_adapter_sub");
    dot = s.bt === "adapter lost" ? "err" : "";
  } else if (s.bt !== "ready") {
    head = T("starting"); dot = "busy";
  } else if (link.code === 0) {
    head = T("idle");
    sub = s.saved.length ? T("idle_sub_saved") : T("idle_sub_new");
    err = errorText(link.error, link.name || (s.saved[0] && s.saved[0].name) || T("device"));
    dot = err ? "err" : "";
  } else if (link.code === 1) {
    head = T("calling", { n: name }); dot = "busy"; disconnect.hidden = false;
  } else if (link.code === 2) {
    head = T("pairing", { n: name }); dot = "busy"; disconnect.hidden = false;
  } else if (link.code < 6) {
    head = T("opening", { n: name }); dot = "busy"; disconnect.hidden = false;
  } else if (link.code === 6) {
    head = T("ready", { n: name }); sub = T("ready_sub"); dot = "busy"; disconnect.hidden = false; tone.hidden = false;
  } else {
    head = T("playing", { n: name }); dot = "ok"; disconnect.hidden = false; tone.hidden = false;
    if (s.stream.active) sub = T("playing_sub", { rate: (s.stream.rate / 1000).toFixed(s.stream.rate === 44100 ? 1 : 0), bp: s.stream.bitpool });
  }
  $("dot").className = "dot " + dot;
  $("headline").textContent = head;
  $("detail").textContent = sub;
  $("error").hidden = !err;
  $("error").textContent = err;
  $("tip").hidden = link.code !== 7;
  if (Date.now() - volumeTouched > 3000) {
    $("vol").value = s.stream.volume;
    $("vol-v").textContent = s.stream.volume + "%";
  }
}

function renderFound(s) {
  const showOthers = $("others").checked;
  const list = s.found.filter((f) => f.audio || showOthers);
  $("others-wrap").hidden = !s.found.some((f) => !f.audio);
  const scan = $("btn-scan");
  scan.disabled = s.scanning || s.bt !== "ready";
  scan.textContent = s.scanning ? T("scanning") : T("scan");
  const ul = $("found");
  if (!list.length) {
    setHtml(ul, s.scanning ? "" : '<li class="empty">' + esc(T("none_found")) + "</li>");
    return;
  }
  setHtml(ul, list.map((f) =>
    '<li><span class="ico">' + (f.audio ? "♪" : "•") + '</span><div class="name"><b>' + esc(f.name || T("unnamed")) + "</b><small>" + esc(f.addr) +
    (f.rssi ? " · " + f.rssi + " dBm" : "") + "</small></div>" +
    (s.link.code > 0 && s.link.addr === f.addr ? "" :
      '<div class="acts"><button class="primary" data-connect="' + esc(f.addr) + '">' + esc(T("connect")) + "</button></div>") + "</li>").join(""));
}

function renderSaved(s) {
  const ul = $("saved");
  if (!s.saved.length) {
    setHtml(ul, '<li class="empty">' + esc(T("none_saved")) + "</li>");
  } else {
    setHtml(ul, s.saved.map((p) => {
      const on = s.link.code > 0 && s.link.addr === p.addr;
      return '<li><span class="ico">♪</span><div class="name"><b>' + esc(p.name || T("unnamed")) + "</b><small>" + esc(p.addr) + "</small></div>" +
        '<div class="acts">' + (on ? "" : '<button data-connect="' + esc(p.addr) + '">' + esc(T("connect")) + "</button>") +
        '<button class="danger" data-forget="' + esc(p.addr) + '">' + esc(T("forget")) + "</button></div></li>";
    }).join(""));
  }
  $("auto").checked = s.auto;
}

function renderAdapter(s) {
  const a = s.adapter;
  const rows = [];
  if (a.present) {
    rows.push([T("chip"), a.chip + (a.clone ? T("clone_note") : "")]);
    rows.push([T("id"), a.id + " · " + a.path]);
    if (a.address) rows.push([T("address"), a.address]);
    rows.push([T("firmware"), a.firmware === 1 ? T("fw_loaded") : a.firmware === 0 ? T("fw_rom") : T("fw_none")]);
    if (a.acl_bufs) rows.push([T("buffers"), a.acl_bufs + " × " + a.acl_mtu + " B"]);
  } else {
    rows.push([T("chip"), "—"]);
  }
  setHtml($("adapter"), rows.map((r) => "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>").join(""));
  const ids = [...new Set(s.adapters.map((x) => x.id))];
  $("prefer-row").hidden = ids.length < 2 && !a.prefer;
  const sel = $("prefer");
  if (document.activeElement !== sel) {
    setHtml(sel, '<option value="">' + esc(T("any")) + "</option>" +
      ids.map((id) => '<option value="' + esc(id) + '"' + (id === a.prefer ? " selected" : "") + ">" + esc(id) + "</option>").join(""));
  }
}

function renderNumbers(s) {
  const st = s.stream;
  const rows = [
    [T("link"), s.link.state + (s.link.incoming ? " (in)" : "")],
    [T("sent"), st.sent], [T("dropped"), st.dropped], [T("underruns"), st.underruns],
    [T("buffered"), st.buffered_ms + " ms"], [T("bitpool"), st.bitpool + " / " + st.bitpool_max],
    [T("capture"), st.capture],
  ];
  setHtml($("numbers"), rows.map((r) => "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>").join(""));
}

async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    state = await r.json();
  } catch (e) { return; }
  if (!langFromConsole && state.lang) {
    langFromConsole = true;
    if (I18N[state.lang]) lang = state.lang;
    applyText();
  }
  $("ver").textContent = "v" + state.version + " · build " + state.build;
  renderStatus(state);
  renderFound(state);
  renderSaved(state);
  renderAdapter(state);
  renderNumbers(state);
}

/* ---------- diagnostics and reports ---------- */

/* What "Copy diagnostics" and a report carry besides the log: the state, readable */
function diagText() {
  const s = state || {};
  const a = s.adapter || {}, l = s.link || {}, st = s.stream || {};
  return [
    "BlueBird " + (s.version || "?") + " build " + (s.build || "?") + ", console language " + (s.lang || "?") + ", up " + (s.uptime || 0) + " s",
    "Adapter: " + (a.present ? a.chip + " " + a.id + " at " + a.path + ", firmware " + a.firmware + ", buffers " + a.acl_bufs + " x " + a.acl_mtu + (a.clone ? ", CSR clone" : "") : "none") + " (state " + (s.bt || "?") + ")",
    "Link: " + (l.state || "?") + (l.name ? ' "' + l.name + '" ' + l.addr : "") + (l.incoming ? ", it called" : "") + (l.error ? ", error: " + l.error : ""),
    "Stream: " + (st.active ? st.rate + " Hz, bitpool " + st.bitpool + "/" + st.bitpool_max + ", " + st.frames_per_packet + " frames per packet" : "off") +
      ", sent " + st.sent + ", dropped " + st.dropped + ", underruns " + st.underruns + ", buffered " + st.buffered_ms + " ms, volume " + st.volume + "%, capture " + st.capture,
    "Saved devices: " + ((s.saved || []).map((p) => p.name + " " + p.addr).join("; ") || "none") + "; reconnect " + (s.auto ? "on" : "off"),
    "Adapters seen: " + ((s.adapters || []).map((x) => x.id + " " + x.path).join("; ") || "none"),
  ];
}

const REPORT_API = "https://omnipad-diagnostics.omnipad-diagnostics.workers.dev/v1/reports";
const REPORT_LOG_MAX = 200 * 1024, REPORT_MSG_MAX = 2048, REPORT_TRIES = 3;
const utf8 = new TextEncoder();
let reportBusy = false, reportDone = false;
const byteLen = (s) => utf8.encode(s).length;
/* The first max bytes, never splitting a character */
function keepStart(s, max) {
  if (byteLen(s) <= max) return s;
  return new TextDecoder().decode(utf8.encode(s).slice(0, max)).replace(/�+$/, "");
}
/* The last max bytes, from a whole line */
function keepEnd(s, max) {
  if (byteLen(s) <= max) return s;
  const tail = new TextDecoder().decode(utf8.encode(s).slice(-max));
  const nl = tail.indexOf("\n");
  return nl >= 0 ? tail.slice(nl + 1) : tail;
}
/* The end of the log, up to max bytes, read in the 32 KB pages /api/log serves */
async function reportLog(max) {
  const first = await fetch("/api/log", { cache: "no-store" });
  const firstText = await first.text();
  const end = Number(first.headers.get("X-Log-Offset")) || 0;
  if (end <= byteLen(firstText)) return keepEnd(firstText, max);
  const from = Math.max(0, end - max);
  let at = from, text = "";
  while (at < end) {
    const res = await fetch("/api/log?since=" + at, { cache: "no-store" });
    const chunk = await res.text();
    const next = Number(res.headers.get("X-Log-Offset")) || at;
    if (!chunk || next <= at) break;
    text += chunk;
    at = next;
  }
  if (from > 0) text = text.slice(text.indexOf("\n") + 1);
  return keepEnd(text, max);
}
function logFirmware(log) {
  const all = [...log.matchAll(/main: firmware ([0-9]+\.[0-9]+) \(0x/g)];
  return all.length ? all[all.length - 1][1] : "";
}
function reportSay(text, kind) {
  $("report-status").textContent = text;
  $("report-status").className = "report-msg" + (kind ? " " + kind : "");
}
function openReport() {
  $("report-box").hidden = false;
  reportDone = false;
  $("btn-report-send").disabled = false;
  reportSay("", "");
  $("report-code").hidden = $("report-code-hint").hidden = true;
  $("report-msg").focus();
}
/* Sent only when the person presses Send; the API is OmniPad's, told which app sent it */
async function sendReport() {
  if (reportBusy || reportDone) return;
  reportBusy = true;
  $("btn-report-send").disabled = true;
  reportSay(T("report_sending"), "");
  try {
    let log = "";
    try { log = await reportLog(REPORT_LOG_MAX); } catch (e) { log = ""; }
    const body = {
      app: "bluebird",
      log,
      diagnostics: diagText().join("\n"),
      version: String((state && state.version) || ""),
      build: String((state && state.build) || ""),
      firmware: logFirmware(log),
      message: keepStart($("report-msg").value.trim(), REPORT_MSG_MAX),
    };
    for (let i = 0; i < REPORT_TRIES; i++) {
      const res = await fetch(REPORT_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(body) });
      let data = {};
      try { data = await res.json(); } catch (e) { /* no JSON body */ }
      if (res.status === 201 && data.code) {
        reportSay("", "");
        $("report-code-text").textContent = data.code;
        $("btn-report-copy").textContent = T("report_copy");
        $("report-code").hidden = $("report-code-hint").hidden = false;
        reportDone = true;
        $("report-msg").value = "";
        return;
      }
      if (res.status === 413 && body.log) {   /* too big: keep the newer half of the log */
        body.log = keepEnd(body.log, Math.floor(byteLen(body.log) / 2));
        continue;
      }
      reportSay(res.status === 429 ? T("report_later") : data.error === "daily_limit" ? T("report_tomorrow") : T("report_fail"), "bad");
      return;
    }
    reportSay(T("report_fail"), "bad");
  } catch (e) {
    reportSay(T("report_fail"), "bad");   /* no internet, or the browser blocked the request */
  } finally {
    reportBusy = false;
    $("btn-report-send").disabled = reportDone;
  }
}

/* Clipboard where the browser allows it, a selection otherwise (plain http on the console) */
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* not on plain http */ }
  try {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return document.execCommand("copy");
  } catch (e) { return false; }
}

async function loadLog() {
  try {
    const r = await fetch("/api/log", { cache: "no-store" });
    const text = await r.text();
    const pre = $("log");
    pre.textContent = text.split("\n").slice(-300).join("\n");
    pre.scrollTop = pre.scrollHeight;
    return text;
  } catch (e) { return ""; }
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.connect) { await post("/api/connect?addr=" + encodeURIComponent(b.dataset.connect)); refresh(); }
  else if (b.dataset.forget) { await post("/api/forget?addr=" + encodeURIComponent(b.dataset.forget)); refresh(); }
});
$("btn-scan").onclick = async () => { await post("/api/scan"); refresh(); };
$("btn-disconnect").onclick = async () => { await post("/api/disconnect"); refresh(); };
$("btn-tone").onclick = () => post("/api/tone");
$("others").onchange = () => state && renderFound(state);
$("auto").onchange = (e) => post("/api/auto?on=" + (e.target.checked ? 1 : 0));
$("prefer").onchange = (e) => post("/api/adapter?prefer=" + encodeURIComponent(e.target.value));
$("vol").oninput = (e) => { volumeTouched = Date.now(); $("vol-v").textContent = e.target.value + "%"; };
$("vol").onchange = (e) => { volumeTouched = Date.now(); post("/api/volume?v=" + e.target.value); };
$("diag").ontoggle = () => { if ($("diag").open && !keepLogText) loadLog(); keepLogText = false; };
$("btn-log").onclick = loadLog;
$("btn-report").onclick = openReport;
$("btn-report-close").onclick = () => { $("report-box").hidden = true; };
$("btn-report-send").onclick = sendReport;
$("btn-report-copy").onclick = async () => {
  if (await copyText($("report-code-text").textContent, $("report-code-text"))) $("btn-report-copy").textContent = T("report_copied");
};
$("btn-copy").onclick = async () => {
  const log = await reportLog(48 * 1024).catch(() => "");
  const text = "BlueBird diagnostics\n```\n" + diagText().join("\n") + "\n```\n```\n" + log.split("\n").slice(-200).join("\n") + "\n```\n";
  if (!$("diag").open) { keepLogText = true; $("diag").open = true; }
  $("log").textContent = text;
  toast((await copyText(text, $("log"))) ? T("copied") : T("copy_fail"));
};
Object.entries(LANG_NAMES).forEach(([code, name]) => $("langSel").add(new Option(name, code)));
$("langSel").onchange = (e) => {
  lang = e.target.value;
  langFromConsole = true;
  save("bluebird.lang", lang);
  applyText();
  if (state) { [$("found"), $("saved"), $("adapter"), $("numbers")].forEach((el) => { el.dataset.html = ""; }); refresh(); }
};
applyText();
refresh();
setInterval(refresh, 1000);
</script>
</body>
