<!doctype html>
<html lang="en" manifest="/bluebird.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueBird</title>
<style>
:root { --ink: #0d1b3e; --mute: #4d628f; --blue: #2f7bff; --blue-2: #2453d6; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--ink);
  background: linear-gradient(180deg, #d3e3ff, #eaf1ff 60%) fixed, #eaf1ff;
  font: 26px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
main { width: 100%; max-width: 980px; padding: 40px 32px; }
svg { width: 140px; height: 140px; filter: drop-shadow(0 10px 24px rgba(47, 123, 255, .45)); }
h1 { font-size: 64px; margin: 12px 0 8px; letter-spacing: .01em; }
.m { font-size: 40px; font-weight: 700; margin: 0 0 24px; }
.card { background: #fff; border: 1px solid #d4e1fa; border-radius: 24px; padding: 28px 32px; margin: 0 auto 28px;
  max-width: 820px; text-align: start; box-shadow: 0 10px 30px rgba(31, 95, 224, .12); }
ol { list-style: none; counter-reset: s; margin: 0; padding: 0; }
li { counter-increment: s; display: flex; align-items: center; gap: 20px; margin: 0 0 18px; font-weight: 600; }
li:last-child { margin-bottom: 0; }
li::before { content: counter(s); flex: none; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; text-align: center;
  color: #fff; font-weight: 800; background: linear-gradient(135deg, var(--blue), var(--blue-2)); }
.hint { color: var(--mute); font-size: 22px; margin: 0 0 28px; }
a.btn { display: inline-block; min-width: 300px; padding: 22px 36px; border-radius: 18px; font-weight: 800; text-decoration: none;
  color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-2)); box-shadow: 0 8px 22px rgba(47, 123, 255, .4); }
a.btn:focus { outline: 5px solid #ffc43d; outline-offset: 4px; }
.spin { width: 56px; height: 56px; margin: 10px auto; border-radius: 50%; border: 7px solid #cfdcf7; border-top-color: var(--blue);
  animation: r 1s linear infinite; }
@keyframes r { to { transform: rotate(360deg); } }
[hidden] { display: none !important; }
@media (max-width: 600px) { body { font-size: 18px; } h1 { font-size: 42px; } .m { font-size: 26px; } svg { width: 96px; height: 96px; }
  li::before { width: 42px; height: 42px; line-height: 42px; } a.btn { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#2347b8"/></linearGradient></defs>
    <rect width="100" height="100" rx="22" fill="url(#g)"/>
    <ellipse cx="40" cy="58" rx="22" ry="18" fill="#fff"/><circle cx="55" cy="41" r="11" fill="#fff"/>
    <path d="M64 38l10 4-10 4z" fill="#ffc43d"/><path d="M22 56L6 46l4 16z" fill="#fff"/>
    <circle cx="58" cy="39" r="2" fill="#0d1b3e"/>
    <path d="M78 34a14 14 0 0 1 0 16M84 28a22 22 0 0 1 0 28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>BlueBird</h1>
  <div id="checking"><div class="spin"></div><p class="m" data-t="checking"></p></div>
  <div id="off" hidden>
    <p class="m" data-t="not_running"></p>
    <div class="card"><ol><li data-t="step1"></li><li data-t="step2"></li></ol></div>
    <p class="hint" data-t="auto"></p>
    <a class="btn" id="retry" href="/start" tabindex="1" data-t="retry"></a>
  </div>
</main>
<script>
"use strict";
const I18N = {
  en: {
    checking: "Opening BlueBird…", not_running: "BlueBird is not running",
    step1: "Send BlueBird.elf with your payload loader and launch it.", step2: "Open this tile again.",
    auto: "This page opens the panel by itself as soon as BlueBird answers.", retry: "Try again",
  },
  pt: {
    checking: "Abrindo o BlueBird…", not_running: "O BlueBird não está rodando",
    step1: "Mande o BlueBird.elf pelo seu carregador de payload e inicie (Launch).", step2: "Abra este tile de novo.",
    auto: "Esta página abre o painel sozinha assim que o BlueBird responder.", retry: "Tentar de novo",
  },
  es: {
    checking: "Abriendo BlueBird…", not_running: "BlueBird no se está ejecutando",
    step1: "Envía BlueBird.elf con tu cargador de payloads e inícialo.", step2: "Vuelve a abrir este icono.",
    auto: "Esta página abre el panel sola en cuanto BlueBird responda.", retry: "Reintentar",
  },
  fr: {
    checking: "Ouverture de BlueBird…", not_running: "BlueBird n'est pas lancé",
    step1: "Envoyez BlueBird.elf avec votre chargeur de payload et lancez-le.", step2: "Rouvrez cette vignette.",
    auto: "Cette page ouvre le panneau d'elle-même dès que BlueBird répond.", retry: "Réessayer",
  },
  de: {
    checking: "BlueBird wird geöffnet…", not_running: "BlueBird läuft nicht",
    step1: "Sende BlueBird.elf mit deinem Payload-Loader und starte es.", step2: "Öffne diese Kachel erneut.",
    auto: "Diese Seite öffnet die Übersicht von selbst, sobald BlueBird antwortet.", retry: "Erneut versuchen",
  },
  ru: {
    checking: "Открываем BlueBird…", not_running: "BlueBird не запущен",
    step1: "Отправьте BlueBird.elf через загрузчик payload и запустите его.", step2: "Снова откройте эту плитку.",
    auto: "Эта страница сама откроет панель, как только BlueBird ответит.", retry: "Повторить",
  },
  ja: {
    checking: "BlueBird を開いています…", not_running: "BlueBird が起動していません",
    step1: "ペイロードローダーで BlueBird.elf を送信して起動してください。", step2: "もう一度このアイコンを開いてください。",
    auto: "BlueBird が応答すると、このページが自動でパネルを開きます。", retry: "再試行",
  },
};
/* This page is kept by the browser (AppCache), so the tile shows it even when BlueBird is not
 * running. It asks the payload in two ways at once (XHR and an image, as HearBridge found that
 * the console's browser lets different kinds through); the first answer opens the panel. */
const PANEL = "http://127.0.0.1:8120/?tv=1", PING = "http://127.0.0.1:8120/ping";
let lang = "en";
try { lang = localStorage.getItem("bluebird.lang") || ""; } catch (e) { lang = ""; }
if (!I18N[lang]) lang = I18N[(navigator.language || "").slice(0, 2)] ? navigator.language.slice(0, 2) : "en";
document.documentElement.lang = lang;
document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = I18N[lang][el.dataset.t]; });

let done = false, round = 0, timer = 0, shown = false;
const $ = (id) => document.getElementById(id);
function openPanel() {
  if (done) return;
  done = true;
  clearTimeout(timer);
  location.replace(PANEL);
}
function check() {
  const mine = ++round;
  let pending = 2, over = false, limit = 0;
  const finish = () => {
    if (over || mine !== round || done) return;
    over = true;
    clearTimeout(limit);
    if (!shown) { shown = true; $("checking").hidden = true; $("off").hidden = false; $("retry").focus(); }
    timer = setTimeout(check, 4000);
  };
  const failed = () => { if (--pending <= 0) finish(); };
  const t = "?t=" + Date.now();
  try {
    const x = new XMLHttpRequest();
    x.open("GET", PING + t, true);
    x.timeout = 3000;
    x.onload = () => (x.status === 200 && String(x.responseText).indexOf("bluebird-ok") >= 0 ? openPanel() : failed());
    x.onerror = x.ontimeout = failed;
    x.send();
  } catch (e) { failed(); }
  const img = new Image();
  img.onload = openPanel;
  img.onerror = failed;
  img.src = PING + ".gif" + t;
  limit = setTimeout(finish, 3500);
}
$("retry").onclick = (e) => {
  e.preventDefault();
  clearTimeout(timer);
  shown = false;
  $("off").hidden = true;
  $("checking").hidden = false;
  check();
};
check();
</script>
</body>
</html>
